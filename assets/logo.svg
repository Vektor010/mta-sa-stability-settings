<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="logo-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39FF88"/>
      <stop offset="60%" stop-color="#00C8FF"/>
      <stop offset="100%" stop-color="#8B5CFF"/>
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="160" height="160" rx="32" fill="#080B10" stroke="#162235" stroke-width="3"/>

  <!-- Cyber Hexagon -->
  <polygon points="80,20 135,52 135,108 80,140 25,108 25,52" fill="#0D1420" stroke="url(#logo-neon)" stroke-width="2.5" filter="url(#logo-glow)"/>

  <!-- Inner Lightning Bolt -->
  <path d="M 72 44 L 98 44 L 84 74 L 104 74 L 62 118 L 74 86 L 56 86 Z" fill="#39FF88"/>
</svg>
